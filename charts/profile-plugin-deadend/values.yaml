domain: teknoir.cloud
deadend:
  image:
    registry: ghcr.io/teknoir/deadend
    version: latest
tlsTerminator:
  image:
    # stunnel baked in (images/stunnel); no package install at start-up, so
    # the sidecar also works on airgapped clusters
    registry: ghcr.io/teknoir/stunnel
    version: 3.22.6-5.75
authorizedKeys: ""
imagePullSecrets:
  - name: ghcr-token
resources:
  requests:
    cpu: 25m
    memory: 20Mi
