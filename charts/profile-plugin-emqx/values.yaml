domain: teknoir.cloud
domainPrefix:

# Dashboard proxy: the EMQX dashboard without its own login, owners only (README).
dashboard:
  enabled: true
  image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
  # Principals allowed to reach the proxy (everything else is denied). The user ingress
  # gateway of this cluster; never the -public gateway.
  gatewayPrincipals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway"]
  # Passwords the guard rotates away whenever the dashboard accepts one of them.
  knownDefaultPasswords: ["teknoir", "public"]
  guardIntervalSeconds: 600
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

emqx:
  replicaCount: 1
  # Adds a checksum/config annotation (sha of the upstream configmap, which holds
  # emqxConfig) to the StatefulSet pod template, so a config change rolls EMQX.
  # Certificate renewal does not need this: see README.
  recreatePods: true
  image:
    registry: emqx/emqx
    version: 5.8.9
    repository: emqx/emqx
    tag: 5.8.9
  persistence:
    enabled: true
    size: 1Gi
  apiKey: teknoir
  apiSecret: teknoir
  emqxConfig:
    EMQX_API_KEY__BOOTSTRAP_FILE: "/opt/emqx-bootstrap/api-keys.txt"
    EMQX_CLUSTER__DISCOVERY_STRATEGY: "k8s"
    # No chart-set dashboard password: the dashboard is reached through the emqx-dashboard
    # proxy (see README), nobody logs in to EMQX. EMQX's built-in default applies on a
    # fresh volume until the guard in the proxy pod rotates it to a random value.
    EMQX_DASHBOARD__DEFAULT_USERNAME: "teknoir"
    # empty: the upstream chart default ("public") is not rendered (its configmap skips empty values)
    EMQX_DASHBOARD__DEFAULT_PASSWORD: ""
    # --AUTHENTICATION & AUTHORIZATION ---
    # 1. Built-in Database Authentication
    EMQX_AUTHENTICATION__1__ENABLE: "true"
    EMQX_AUTHENTICATION__1__MECHANISM: "password_based"
    EMQX_AUTHENTICATION__1__BACKEND: "built_in_database"
    # 2. JWKS Authentication
    EMQX_AUTHENTICATION__2__ENABLE: "true"
    EMQX_AUTHENTICATION__2__MECHANISM: "jwt"
    EMQX_AUTHENTICATION__2__USE_JWKS: "true"
    EMQX_AUTHENTICATION__2__ENDPOINT: "http://jwks:8083/api/v1/keys"
    EMQX_AUTHENTICATION__2__FROM: "password"
    #refresh_interval = 60
    EMQX_AUTHENTICATION__2__REFRESH_INTERVAL: "60"
    #ssl = {enable = false}
    EMQX_AUTHENTICATION__2__SSL__ENABLE: "false"
    #acl_claim_name = "acl"
    EMQX_AUTHENTICATION__2__ACL_CLAIM_NAME: "acl"
    #verify_claims = {aud = "{{.projectId}}"}
    EMQX_AUTHENTICATION__2__VERIFY_CLAIMS: '{aud= \"teknoir\"}'
    # EMQX 5 name of the intended 3 MB limit (the former EMQX_MAX_PACKET_SIZE is not an
    # EMQX 5 setting: the effective mqtt.max_packet_size stayed at the 1MB default)
    EMQX_MQTT__MAX_PACKET_SIZE: "3MB"
    # EMQX 5 names (the EMQX_LISTENER__SSL__* names are EMQX 4's and are ignored: the
    # 8883 listener then serves EMQX's built-in self-signed "EMQ RootCA" certificate)
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: "/certs/tls.key"
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: "/certs/tls.crt"
  pdb:
    enabled: false
    maxUnavailable: 1
  extraVolumeMounts:
    - name: emqx-bootstrap-api-keys
      mountPath: /opt/emqx-bootstrap
      readOnly: true
    - name: emqx-certs
      mountPath: /certs
      readOnly: true
  extraVolumes:
    - name: emqx-bootstrap-api-keys
      secret:
        secretName: emqx-bootstrap-api-keys
    - name: emqx-certs
      secret:
        secretName: domain-wildcard-tls
  resources:
    requests:
      cpu: 25m
      memory: 50Mi
