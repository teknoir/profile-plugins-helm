---
# jwks-server has no authentication of its own, so these policies decide who
# may register or delete a device key.
#   - GET (EMQX fetching /api/v1/keys, device-controller reading it): any source.
#     The response only holds public keys.
#   - POST/PUT/DELETE (device key registration and revocation): only the
#     workload identities in .Values.authorization.writers, matched on the
#     caller's mTLS principal.
#   - /api/v1/mqtt/* (EMQX's http authenticator and authorization audit sink):
#     only the EMQX pod of this namespace (jwks.emqxPrincipal), POST only. EMQX
#     is never a writer.
# Other ALLOW policies in the teamspace (namespace owner, per-user policies)
# select every workload, this one included, and ALLOW policies are OR'ed. The
# DENY below is evaluated before any ALLOW, so it is what limits writes.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  labels:
    app: jwks
    teknoir.org/plugin: jwks
  name: jwks-deny-writes
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: jwks
  action: DENY
  rules:
    - to:
        - operation:
            notMethods: ["GET"]
            notPaths: ["/api/v1/mqtt/*"]
      {{- with .Values.authorization.writers }}
      from:
        - source:
            notPrincipals:
              {{- range . }}
              - {{ printf "%s/ns/%s/sa/%s" $.Values.authorization.trustDomain .namespace .serviceAccount | quote }}
              {{- end }}
      {{- end }}
---
# The MQTT endpoints answer whether a device token is valid for a name, so only
# EMQX may call them: anything else on /api/v1/mqtt/* (other in-namespace pods,
# which the namespace-wide ALLOW admits, and plaintext callers, which have no
# principal) is denied. This alone does not stop a token oracle: Istio does not
# decode %2F, so a GET on /api/v1/mqtt%2Fauthn misses both DENYs and matches the
# open GET ALLOW, and gorilla/mux routes on the decoded path. The protection also
# relies on jwks-server's mqtt handlers accepting POST only (405 otherwise).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  labels:
    app: jwks
    teknoir.org/plugin: jwks
  name: jwks-mqtt-auth
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: jwks
  action: DENY
  rules:
    - to:
        - operation:
            paths: ["/api/v1/mqtt/*"]
      from:
        - source:
            notPrincipals:
              - {{ include "jwks.emqxPrincipal" . | quote }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  labels:
    app: jwks
    teknoir.org/plugin: jwks
  name: jwks
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: jwks
  action: ALLOW
  rules:
    - to:
      - operation:
          methods: ["GET"]
    {{- with .Values.authorization.writers }}
    - from:
        - source:
            principals:
              {{- range . }}
              - {{ printf "%s/ns/%s/sa/%s" $.Values.authorization.trustDomain .namespace .serviceAccount | quote }}
              {{- end }}
      to:
        - operation:
            methods: ["POST", "PUT", "DELETE"]
    {{- end }}
    - from:
        - source:
            principals:
              - {{ include "jwks.emqxPrincipal" . | quote }}
      to:
        - operation:
            methods: ["POST"]
            paths: ["/api/v1/mqtt/*"]
