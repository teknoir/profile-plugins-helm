imagePullSecrets:
  - name: ghcr-token

persistentVolumeClaimSize: 10Gi

# Who may register, replace and delete device keys (POST/PUT/DELETE). GET is open.
# Matched on the mTLS identity of the caller, so each writer needs an Istio
# sidecar. Only device-controller writes keys; an empty list makes jwks read-only.
authorization:
  trustDomain: cluster.local
  writers:
    - namespace: teknoir-system
      serviceAccount: device-controller-service-account

# MQTT device authentication (POST /api/v1/mqtt/authn, called by EMQX's http authenticator)
# and the authorization audit sink (POST /api/v1/mqtt/authz-audit). See the profile-plugin-emqx
# README "MQTT authentication and authorization".
#   authnMode: observe (failures answer "ignore" and log would_deny) or enforce (failures
#     answer "deny"). Anything else fails the render.
#   audience: the "aud" a device token must carry (exact match).
#   emqxServiceAccount: the ServiceAccount of the EMQX pod in this namespace; only its mTLS
#     principal may call /api/v1/mqtt/*.
mqttAuth:
  authnMode: enforce
  audience: teknoir
  emqxServiceAccount: emqx

jwks:
  image:
    registry: ghcr.io/teknoir/jwks-server
    # jwks-server branch mqtt-auth (MQTT authn endpoint); main has not merged it yet.
    version: sha-de5c5ed8@sha256:403771123fa3486a10fee3ac7dcd60a9ef4d1d3d8b63b13299afd09eb5525437
  resources:
    requests:
      cpu: 25m
      memory: 20Mi

redis:
  image:
    registry: redis/redis-stack-server
    version: 6.2.6-v9
  resources:
    requests:
      cpu: 25m
      memory: 20Mi
