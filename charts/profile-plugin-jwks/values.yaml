imagePullSecrets:
  - name: ghcr-token

persistentVolumeClaimSize: 10Gi

# Who may register, replace and delete device keys (POST/PUT/DELETE). GET is open.
# Matched on the mTLS identity of the caller, so each writer needs an Istio
# sidecar. Only device-controller writes keys; an empty list makes jwks read-only.
authorization:
  trustDomain: cluster.local
  writers:
    - namespace: teknoir-system
      serviceAccount: device-controller-service-account

jwks:
  image:
    registry: ghcr.io/teknoir/jwks-server
    version: latest@sha256:a69bebf5b3b751d438a39b3e8c0f67bdce1b47fef93a40bfd8997f8ec85f6c0d
  resources:
    requests:
      cpu: 25m
      memory: 20Mi

redis:
  image:
    registry: redis/redis-stack-server
    version: 6.2.6-v9
  resources:
    requests:
      cpu: 25m
      memory: 20Mi
