name: Build stunnel image

on:
  push:
    branches: [main]
    paths: ["images/stunnel/**", ".github/workflows/stunnel-image.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/teknoir/stunnel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          VERSION="$(cat images/stunnel/VERSION)"
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: images/stunnel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
